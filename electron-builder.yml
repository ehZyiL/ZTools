appId: top.z-tools
productName: ZTools
publish:
  provider: github
  owner: ZToolsCenter
  repo: ZTools
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.DS_Store'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  - '!{CHANGELOG.md,changelog.md,README.md,README_EN.md,CONTRIBUTING.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,.gitmodules,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo,vitest.config.*}'
  - '!{.claude/**,.githooks/**,.github/**}'
  - '!AGENTS.md'
  - '!docs/**'
  - '!tests/**'
  - '!updater/**'
  - '!ztools-api-types/**'
  - '!ztools-plugin-cli/**'
  - '!scripts/**'
  - '!internal-plugins/**'
  - '!**/*.map'
  - '!**/node_modules/**/*.{d.ts,d.cts,d.mts}'
  - '!**/node_modules/openai/src/**'
  - '!**/node_modules/@mixmark-io/domino/.yarn/**'
  - '!**/node_modules/lmdb/{dependencies,src}/**'
  - '!**/node_modules/uiohook-napi/{libuiohook,src}/**'
asarUnpack:
  - resources/**
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
fileAssociations:
  - ext: zpx
    name: ZTools Plugin
    description: ZTools Plugin Package
    role: Viewer
win:
  compression: maximum
  executableName: ZTools
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  compression: maximum
  # The Developer ID identity is selected by CSC_NAME in CI. Leaving this
  # unset keeps local builds compatible with machines that have no certificate.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
  # rpm 的 Vendor 由 maintainer 派生，必须写成可读的维护者，邮箱请替换为真实联系方式。
  maintainer: ZToolsCenter <ZToolsCenter@users.noreply.github.com>
  vendor: ZToolsCenter
  category: Utility
  synopsis: 高性能应用启动器与插件平台
  description: ZTools 是一个高性能、可扩展的应用启动器和插件平台。
appImage:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
rpm:
  # RPM 包名使用小写，安装目录仍是 /opt/ZTools。
  packageName: ztools
  compression: xz
  # rpm 4.19+ 默认会为可执行文件生成 /usr/lib/.build-id 链接，应用包不需要。
  fpm:
    - --rpm-rpmbuild-define
    - _build_id_links none
  # 显式列出 Fedora 仓库中的真实包名，避免依赖 fpm 的通用默认值。
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret
npmRebuild: false

afterPack: ./build/afterPack.js
